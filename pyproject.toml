[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "redline-gate"
version = "0.1.0"
description = "A document review loop where a model proposes tracked changes to your own file, and a gate checks every one before a person approves"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Joseph Bisaccia"}]
requires-python = ">=3.10"
keywords = ["gate", "ci", "llm-evaluation", "human-in-the-loop", "docx", "tracked-changes", "grounding"]
dependencies = ["python-docx>=1.2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://getaiintegrations.com/projects"
Repository = "https://github.com/jbisaccia-9/redline-gate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
